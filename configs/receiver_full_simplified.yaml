debug_overfit:
  enabled: false  # デバッグ用過学習モードの有効化 (default=false)
  num_samples: 8  # 過学習テスト用のサンプル数 (default=8)
  seed: 42  # 乱数シード (default=42)

model:
  input_dim: 16  # Enhanced with relative features: x, y, vx, vy, height, weight, ball_possession (7) + dx_to_kicker, dy_to_kicker, dist_to_kicker, angle_to_kicker (4) + dx_to_goal, dy_to_goal, dist_to_goal, angle_to_goal (4) + team_id (1) = 16
  hidden_dim: 256  # 隠れ層の次元数 (default=128) - 修正: 128→256に増やしてモデル容量を拡大（Top-3精度70%を目指す）
  num_classes: 22  # クラス数（プレイヤー数）(default=22)
  num_layers: 3  # GATv2レイヤー数 (default=3) - 修正: 5→3に戻して学習を安定化（Focal Lossと併用）
  num_heads: 8  # アテンションヘッド数 (default=4) - 修正: 4→8に増やしてより強力なアテンション機構に（モデルアーキテクチャ改善）
  dropout: 0.05  # ドロップアウト率 (default=0.0) - 修正: 0.1→0.05に下げて学習をさらに促進（モデル容量を活かす）
  edge_dim: 10  # エッジ特徴次元 (enhanced): dx, dy, dist_ij, angle_ij, same_team, dvx, dvy, rel_speed, from_kicker, to_kicker (was 5)
  # global_dim: Receiverタスクでは使用しない (TacticAI paper baseline)

optimizer:
  type: adam  # オプティマイザーの種類 (default="adam")
  lr: 0.001  # 学習率 (default=0.001) - 修正: 0.0008→0.001に上げて学習を促進（スケジューラーなしで安定した学習率を使用）
  weight_decay: 0.0001  # 重み減衰（L2正則化）(default=0.0)

scheduler:
  type: none  # スケジューラーの種類 (default="none") - 修正: cosine→noneに変更（過学習テストで成功した設定に戻す、学習率を一定に保つ）
  # T_max: 200  # コサインアニーリングの周期（エポック数）(default=train.epochs)
  # eta_min: 0.00001  # 最小学習率 (default=1e-6)
  # warmup_epochs: 5  # ウォームアップエポック数 (default=5)

train:
  batch_size: 32  # バッチサイズ (default=32) - 修正: 16→32に戻して学習を安定化
  epochs: 200  # 最大エポック数 (default=100) - 修正: 120→200に増やして十分な学習を確保（Top-3精度70%を目指す）
  amp: true  # Automatic Mixed Precisionの使用 (default=false)
  grad_clip:
    enabled: true  # 勾配クリッピングの有効化 (default=true)
    max_norm: 0.5  # 勾配の最大ノルム (default=1.0) - 修正: 1.0→0.5に厳しくして学習を安定化

data:
  train_path: data/processed_ck/receiver_train/data.pickle  # 訓練データのパス
  val_path: data/processed_ck/receiver_val/data.pickle  # 検証データのパス
  test_path: data/processed_ck/receiver_test/data.pickle  # テストデータのパス
  format: pickle  # データ形式 (default="pickle")

loss:
  type: cross_entropy  # 損失関数の種類 (default="cross_entropy")
  label_smoothing: 0.1  # ラベルスムージング率 (default=0.0)
  weight: 1.0  # 損失の重み (default=1.0)
  focal_loss:
    enabled: true  # Focal Lossの使用 (default=false) - 修正: false→trueに変更して困難なサンプルの学習を促進
    alpha: 1.0  # レアクラスの重み係数 (default=1.0)
    gamma: 2.0  # フォーカシングパラメータ (default=2.0)
  class_weights: null  # クラスごとの重み (default=null)
  regularization:
    l2_weight: 0.0  # L2正則化の重み (default=0.0)
    dropout_rate: 0.0  # ドロップアウト正則化の重み (default=0.0)

d2:
  group_pool: false  # グループプーリングの使用 (default=false)
  transforms:
    hflip: true  # 水平フリップのデータ拡張 (default=false) - 修正: false→trueに変更してデータ拡張を有効化
    vflip: true  # 垂直フリップのデータ拡張 (default=false) - 修正: false→trueに変更してデータ拡張を有効化

early_stopping:
  patience: 50  # 改善が見られない場合の待機エポック数 (default=30) - 修正: 30→50に増やしてより長く学習を継続
  min_delta: 0.001  # 改善とみなす最小変化量 (default=0.0) - 修正: 0.0→0.001に設定して微小な改善も検出

eval:
  batch_size: 5  # 評価時のバッチサイズ (default=5)
  min_cands_eval: 1  # 評価に必要な最小候補数 (default=1)

device: auto  # デバイス (default="auto")
seed: 42  # 乱数シード (default=42)
num_workers: 4  # データローダーのワーカー数 (default=4)
prefetch_factor: 2  # プリフェッチ係数 (default=2)
persistent_workers: true  # ワーカーをエポック間で保持 (default=true)
log_level: INFO  # ログレベル (default="INFO")
log_dir: runs  # ログ保存ディレクトリ (default="runs")
checkpoint_dir: checkpoints  # チェックポイント保存ディレクトリ (default="checkpoints")

