debug_overfit:
  enabled: false  # デバッグ用過学習モードの有効化 (default=false)
  num_samples: 8  # 過学習テスト用のサンプル数 (default=8)
  seed: 42  # 乱数シード (default=42)

model:
  input_dim: 16  # Enhanced with relative features: x, y, vx, vy, height, weight, ball_possession (7) + dx_to_kicker, dy_to_kicker, dist_to_kicker, angle_to_kicker (4) + dx_to_goal, dy_to_goal, dist_to_goal, angle_to_goal (4) + team_id (1) = 16
  hidden_dim: 512  # 隠れ層の次元数 (default=128) - 以前の良い結果の設定に合わせて512に変更
  num_classes: 22  # クラス数（プレイヤー数）(default=22)
  num_layers: 3  # GATv2レイヤー数 (default=3)
  num_heads: 4  # アテンションヘッド数 (default=4)
  dropout: 0.0  # ドロップアウト率 (default=0.0) - 以前の良い結果の設定に合わせて0.0に変更
  edge_dim: 10  # エッジ特徴次元 (enhanced): dx, dy, dist_ij, angle_ij, same_team, dvx, dvy, rel_speed, from_kicker, to_kicker (was 5)
  # global_dim: Receiverタスクでは使用しない (TacticAI paper baseline)

optimizer:
  type: adam  # オプティマイザーの種類 (default="adam")
  lr: 0.001  # 学習率 (default=0.001) - 以前の良い結果の設定に合わせて0.001に変更
  weight_decay: 0.0  # 重み減衰（L2正則化）(default=0.0) - 以前の良い結果の設定に合わせて0.0に変更

scheduler:
  type: none  # スケジューラーの種類 (default="none") - 以前の良い結果の設定に合わせてnoneに変更

train:
  batch_size: 32  # バッチサイズ (default=32)
  epochs: 50  # 最大エポック数 (default=100) - 以前の良い結果の設定に合わせて50に変更
  amp: false  # Automatic Mixed Precisionの使用 (default=false) - 以前の良い結果の設定に合わせてfalseに変更
  grad_clip:
    enabled: true
    max_norm: 1.0  # Clip gradients to prevent explosion  # 勾配クリッピングの有効化 (default=true) - 以前の良い結果の設定に合わせてfalseに変更（以前のログにはgrad_clipの設定がなかった）
  save_backbone: true  # バックボーンのみを保存するか (default=true) - 転移学習用
  backbone_save_path: null  # バックボーン保存パス (nullの場合は自動生成、D2有無に応じてbackbone_d2.ckptまたはbackbone_no_d2.ckpt)

data:
  train_path: data/processed_ck/receiver_train/data.pickle  # 訓練データのパス - 以前の良い結果の設定に合わせてprocessed_ckに変更
  val_path: data/processed_ck/receiver_val/data.pickle  # 検証データのパス - 以前の良い結果の設定に合わせてprocessed_ckに変更
  test_path: data/processed_ck/receiver_test/data.pickle  # テストデータのパス - 以前の良い結果の設定に合わせてprocessed_ckに変更
  format: pickle  # データ形式 (default="pickle")
  merge_val_to_train: true  # ValデータをTrainに統合する (default=false) - データが少ないため統合推奨

loss:
  type: cross_entropy  # 損失関数の種類 (default="cross_entropy")
  label_smoothing: 0.0  # ラベルスムージング率 (default=0.0) - 以前の良い結果の設定に合わせて0.0に変更
  weight: 1.0  # 損失の重み (default=1.0)
  focal_loss:
    enabled: false  # Focal Lossの使用 (default=false) - 修正: true→falseに戻して標準的な損失関数を使用
    alpha: 1.0  # レアクラスの重み係数 (default=1.0)
    gamma: 2.0  # フォーカシングパラメータ (default=2.0)
  class_weights: null  # クラスごとの重み (default=null)
  regularization:
    l2_weight: 0.0  # L2正則化の重み (default=0.0)
    dropout_rate: 0.0  # ドロップアウト正則化の重み (default=0.0)

d2:
  enabled: true  # D2群対応の有効化 (default=true) - falseにすると通常のGATv2Networkを使用
  group_pool: false  # グループプーリングの使用 (default=false, legacy option)
  transforms:
    hflip: false  # 水平フリップのデータ拡張 (default=false) - 以前の良い結果の設定に合わせてfalseに変更
    vflip: false  # 垂直フリップのデータ拡張 (default=false) - 以前の良い結果の設定に合わせてfalseに変更

early_stopping:
  patience: 20  # 改善が見られない場合の待機エポック数 (default=30) - 以前の良い結果の設定に合わせて20に変更
  min_delta: 0.0005  # 改善とみなす最小変化量 (default=0.0) - 以前の良い結果の設定に合わせて0.0005に変更

eval:
  batch_size: 5  # 評価時のバッチサイズ (default=5)
  min_cands_eval: 1  # 評価に必要な最小候補数 (default=1)

device: auto  # デバイス (default="auto")
seed: 42  # 乱数シード (default=42)
num_workers: 4  # データローダーのワーカー数 (default=4)
prefetch_factor: 2  # プリフェッチ係数 (default=2)
persistent_workers: true  # ワーカーをエポック間で保持 (default=true)
log_level: INFO  # ログレベル (default="INFO")
log_dir: runs  # ログ保存ディレクトリ (default="runs")
checkpoint_dir: checkpoints  # チェックポイント保存ディレクトリ (default="checkpoints")

