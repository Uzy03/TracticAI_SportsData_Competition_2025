# Configuration for shot prediction task using pretrained receiver backbone
# 
# 学習内容:
# - Pretrained receiver backbone: Fine-tuning（デフォルトでは学習される）
# - Pretrained receiver head: 凍結（推論時のみ使用、学習されない）
# - Shot head: 新規作成して学習
#
# 受け手とシュートを同時に学習するのではなく、受け手予測で学習された
# エンコーダ（バックボーン）を使って、シュート予測ヘッドのみを学習します。

# Pretrained model configuration
pretrained:
  backbone_path: null  # nullの場合はd2.enabledに応じて自動選択（backbone_d2.ckpt または backbone_no_d2.ckpt）
  receiver_checkpoint_path: "checkpoints/receiver/best.ckpt"  # For receiver head (frozen)
  use_receiver_for_conditioning: true  # Use receiver probabilities for conditional shot prediction
  freeze_backbone: false  # Fine-tune backbone (not freeze)
  lr_backbone: 0.0001  # Learning rate for backbone (lower than head)
  lr_head: 0.001  # Learning rate for shot head

# Model configuration (should match pretrained backbone)
model:
  input_dim: 16  # Must match pretrained receiver model
  hidden_dim: 512  # Must match pretrained receiver model
  num_layers: 3  # Must match pretrained receiver model
  num_heads: 4  # Must match pretrained receiver model
  dropout: 0.0  # Dropout for shot head only (backbone dropout is from pretrained)
  edge_dim: 10  # Must match pretrained receiver model

# Optimizer configuration
optimizer:
  type: "adam"
  lr: 0.001  # Default learning rate (will be overridden by lr_backbone/lr_head if pretrained is used)
  weight_decay: 0.0001

# Scheduler configuration
scheduler:
  type: "cosine"
  T_max: 50
  eta_min: 0.000001
  warmup_epochs: 5

# Training configuration
train:
  batch_size: 32
  epochs: 50
  amp: false  # Automatic mixed precision

# Data configuration
# Uses same data source as receiver prediction (data/processed_ck)
data:
  train_path: "data/processed_ck/shot_train/data.pickle"
  val_path: "data/processed_ck/shot_val/data.pickle"
  test_path: "data/processed_ck/shot_test/data.pickle"
  format: "pickle"
  merge_val_to_train: true  # ValデータをTrainに統合する (default=false) - データが少ないため統合推奨

# Loss configuration
loss:
  type: "binary_cross_entropy"
  label_smoothing: 0.0
  weight: 1.0
  pos_weight: 1.0  # Weight for positive class (adjust for class imbalance)
  
  # Focal loss parameters (alternative to BCE)
  focal_loss:
    enabled: false
    alpha: 0.25
    gamma: 2.0
    
  # Class weights for imbalanced datasets
  class_weights: null
  
  # Regularization terms
  regularization:
    l2_weight: 0.0001
    dropout_rate: 0.0

# D2 equivariance configuration (should match pretrained receiver model)
d2:
  enabled: true  # Must match pretrained receiver model setting
  group_pool: false  # Not used (D2 is handled internally in ShotModelWithReceiver)
  transforms:
    hflip: false
    vflip: false

# Early stopping configuration
early_stopping:
  patience: 10

# Evaluation configuration
eval:
  batch_size: 32

# System configuration
device: "auto"
seed: 42
num_workers: 0  # Set to 0 to avoid multiprocessing issues (same as receiver prediction)
log_level: "INFO"
log_dir: "runs"
checkpoint_dir: "checkpoints"

