# Configuration for shot prediction task - Debug Overfit Test
# 過学習テスト用の設定ファイル（受け手予測と同じ要領）

# Debug overfit configuration
debug_overfit:
  enabled: true  # デバッグ用過学習モードの有効化
  num_samples: 8  # 過学習テスト用のサンプル数（受け手予測と同じ）
  seed: 42  # 乱数シード

# Pretrained model configuration
pretrained:
  backbone_path: null  # nullの場合はd2.enabledに応じて自動選択（backbone_d2.ckpt または backbone_no_d2.ckpt）
  receiver_checkpoint_path: "checkpoints/receiver/best.ckpt"  # For receiver head (frozen)
  use_receiver_for_conditioning: true  # Use receiver probabilities for conditional shot prediction
  freeze_backbone: true  # Freeze backbone (only train shot head) - User request
  lr_backbone: 0.0001  # Learning rate for backbone (lower than head, not used when frozen)
  lr_head: 0.001  # 最初の安定した設定に戻す（0.001）

# Model configuration (should match pretrained backbone)
model:
  input_dim: 16  # Must match pretrained receiver model
  hidden_dim: 512  # Must match pretrained receiver model
  num_layers: 3  # Must match pretrained receiver model
  num_heads: 4  # Must match pretrained receiver model
  dropout: 0.0  # Dropout for shot head only (backbone dropout is from pretrained)
  edge_dim: 10  # Must match pretrained receiver model

# Optimizer configuration
optimizer:
  type: "adam"
  lr: 0.001  # Default learning rate (will be overridden by lr_backbone/lr_head if pretrained is used)
  weight_decay: 0.0  # 過学習テスト用にL2正則化を完全に無効化

# Scheduler configuration
scheduler:
  type: "none"  # 過学習テスト用にスケジューラーを無効化（学習率を固定）

# Training configuration
train:
  batch_size: 32  # 最初の安定した設定に戻す（batch_size=1は勾配ノイズが大きすぎて不安定）
  epochs: 500  # 過学習テスト用にエポック数を大幅に増加
  amp: false  # Automatic mixed precision
  grad_clip:
    enabled: true  # 最初の安定した設定に戻す（勾配クリッピングを有効化）
    max_norm: 1.0  # 最初の安定した設定に戻す（1.0）

# Data configuration (will be overridden by debug_overfit mode)
data:
  train_path: "data/processed_ck/shot_train/data.pickle"
  val_path: "data/processed_ck/shot_val/data.pickle"
  test_path: "data/processed_ck/shot_test/data.pickle"
  format: "pickle"
  merge_val_to_train: false  # Not used in debug_overfit mode

# Loss configuration
loss:
  type: "binary_cross_entropy"
  label_smoothing: 0.0
  weight: 1.0
  pos_weight: 1.0  # Weight for positive class (adjust for class imbalance)
  
  # Focal loss parameters (alternative to BCE)
  focal_loss:
    enabled: false
    alpha: 0.25
    gamma: 2.0
    
  # Class weights for imbalanced datasets
  class_weights: null
  
  # Regularization terms
  regularization:
    l2_weight: 0.0001
    dropout_rate: 0.0

# D2 equivariance configuration (should match pretrained receiver model)
d2:
  enabled: false  # Must match pretrained receiver model setting (前回の実行ではfalseだったため、falseに設定)
  group_pool: false  # Not used (D2 is handled internally in ShotModelWithReceiver)
  transforms:
    hflip: false
    vflip: false

# Early stopping configuration (disabled in debug_overfit mode)
early_stopping:
  patience: 10

# Evaluation configuration
eval:
  batch_size: 32

# System configuration
device: "auto"
seed: 42
num_workers: 0  # Set to 0 to avoid multiprocessing issues
log_level: "INFO"
log_dir: "runs"
checkpoint_dir: "checkpoints"

